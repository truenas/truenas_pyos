name: QEMU VM Tests

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      kernel_train:
        type: string
        required: false
        default: ""
        description: "(optional) TrueNAS kernel train to test ('master' or '26'; default: master)"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qemu-test:
    name: Debian Trixie QEMU Test
    runs-on: ubuntu-24.04
    env:
      # The VM boots the TrueNAS production kernel published by the
      # truenas/linux rolling releases (<train>-nightly), consumed the same
      # way the truenas/zfs CI does. That is the kernel TrueNAS actually
      # ships, and it populates the statmount sb_source / uid-gid-map fields
      # the fs tests exercise; its libc-dev package provides the matching
      # UAPI headers the C extension builds against.
      KERNEL_TRAIN: ${{ github.event.inputs.kernel_train || 'master' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Setup QEMU
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-1-setup.sh

    - name: Get OpenZFS commit hash
      id: zfs-hash
      run: |
        ZFS_COMMIT=$(git ls-remote https://github.com/truenas/zfs.git refs/heads/truenas/zfs-2.4-release | cut -f1)
        echo "hash=$ZFS_COMMIT" >> $GITHUB_OUTPUT
        echo "OpenZFS commit: $ZFS_COMMIT"

    - name: Get TrueNAS kernel release
      id: tn-kernel
      run: |
        # Fetch the current nightly release name up front so the ZFS package
        # cache can be keyed on it (the kmods must match the kernel) and the
        # build step can verify the VM installed and booted that release.
        url="https://github.com/truenas/linux/releases/download/${KERNEL_TRAIN}-nightly"
        if ! curl --fail -LSs "$url/manifest.json" -o /tmp/tn-manifest.json; then
          echo "ERROR: no ${KERNEL_TRAIN}-nightly kernel release published at $url yet"
          exit 1
        fi
        release=$(jq -r '.release' /tmp/tn-manifest.json)
        echo "release=$release" >> $GITHUB_OUTPUT
        echo "TrueNAS $KERNEL_TRAIN kernel: $release"

    - name: Cache OpenZFS packages
      id: cache-zfs
      uses: actions/cache@v4
      with:
        path: /tmp/zfs-debs
        key: zfs-debs-debian-trixie-${{ steps.zfs-hash.outputs.hash }}-${{ steps.tn-kernel.outputs.release }}

    - name: Start Debian Trixie VM
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-2-start.sh

    - name: Build and install truenas_pyos
      timeout-minutes: 60
      env:
        ZFS_CACHE_HIT: ${{ steps.cache-zfs.outputs.cache-hit }}
        KERNEL_RELEASE: ${{ steps.tn-kernel.outputs.release }}
      run: bash .github/workflows/scripts/qemu-3-build.sh

    - name: Restart VM to load kernel modules
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-3.5-restart.sh

    - name: Run pytest tests
      timeout-minutes: 20
      run: bash .github/workflows/scripts/qemu-4-test.sh

    - name: Collect logs
      if: always()
      timeout-minutes: 5
      run: bash .github/workflows/scripts/qemu-5-collect-logs.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-logs-debian-trixie
        path: /tmp/qemu-logs.tar.gz
        if-no-files-found: ignore

    - name: Test Summary
      if: always()
      run: bash .github/workflows/scripts/qemu-6-summary.sh
