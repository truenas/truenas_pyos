name: QEMU VM Tests

on:
  pull_request:
  workflow_call:
    inputs:
      train:
        # TrueNAS train (master or 26) whose rolling <train>-nightly kernel
        # and OpenZFS releases to test against.  Empty (the default, used by
        # nightly / PR runs) means derive it from the branch via
        # train-for-ref.sh.  Callers may pass a specific train to pin one.
        description: "(optional) TrueNAS train to test against ('master' or '26'; default: derived from branch)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      train:
        type: string
        required: false
        default: ""
        description: "(optional) TrueNAS train to test against ('master' or '26'; default: derived from branch)"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Bump IMAGE_VERSION to bust the cached Debian cloud image (e.g. when it
# has drifted).  The TrueNAS kernel and OpenZFS debs are downloaded fresh
# from their rolling releases every run, so they are not tied to this key.
env:
  IMAGE_VERSION: v1

jobs:
  qemu-test:
    name: Debian Trixie QEMU Test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        # PR runs check out the PR head; schedule / workflow_dispatch /
        # workflow_call runs (nightly) have no PR event, so fall back to
        # the triggering commit (master for scheduled runs).
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Determine TrueNAS train
      id: train
      run: |
        # The VM boots the TrueNAS production kernel (truenas/linux) and
        # installs the matching prebuilt OpenZFS kmod + userland (truenas/zfs),
        # both taken from the rolling <train>-nightly GitHub releases -- the
        # tests need the real kernel and a live ZFS pool (e.g. the ACL tests
        # run against posixacl / nfsv4 datasets).  One train selects both: an
        # explicit input (workflow_dispatch or workflow_call) wins, otherwise
        # the branch (the PR base on PRs, else the triggering ref) maps to
        # its train.
        if [ -n "${{ inputs.train }}" ]; then
          TRAIN="${{ inputs.train }}"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          TRAIN="$(.github/workflows/scripts/train-for-ref.sh "${{ github.base_ref }}")"
        else
          TRAIN="$(.github/workflows/scripts/train-for-ref.sh "${{ github.ref_name }}")"
        fi
        echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
        echo "Using TrueNAS train: $TRAIN"

    - name: Setup QEMU
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-1-setup.sh

    - name: Cache Debian Trixie cloud image
      id: cache-image
      uses: actions/cache@v4
      with:
        path: /tmp/qemu-work/debian-trixie.qcow2
        key: debian-trixie-cloudimage-${{ env.IMAGE_VERSION }}

    - name: Start Debian Trixie VM
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-2-start.sh

    - name: Build and install truenas_pyos
      timeout-minutes: 30
      env:
        TRAIN: ${{ steps.train.outputs.train }}
      run: bash .github/workflows/scripts/qemu-3-build.sh

    - name: Restart VM to load kernel modules
      timeout-minutes: 10
      run: bash .github/workflows/scripts/qemu-3.5-restart.sh

    - name: Run pytest tests
      timeout-minutes: 20
      run: bash .github/workflows/scripts/qemu-4-test.sh

    - name: Collect logs
      if: always()
      timeout-minutes: 5
      run: bash .github/workflows/scripts/qemu-5-collect-logs.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-logs-debian-trixie
        path: /tmp/qemu-logs.tar.gz
        if-no-files-found: ignore

    - name: Test Summary
      if: always()
      run: bash .github/workflows/scripts/qemu-6-summary.sh
