name: Build and Test

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The Debian package build runs with no network egress, so setup.py's
    # build-time liburing clone cannot reach github here. Check the pinned
    # liburing 2.15 out up front (actions/checkout does have access) and point
    # the build at it via TRUENAS_PYOS_LIBURING_SRC; the build-time clone stays
    # the default for ordinary networked builds.
    - name: Fetch pinned liburing
      uses: actions/checkout@v4
      with:
        repository: axboe/liburing
        ref: liburing-2.15
        path: liburing

    - name: Install system dependencies
      run: |
        apt update
        apt install -y python3-dev build-essential devscripts debhelper
        apt install -y dh-python pybuild-plugin-pyproject python3-pytest python3-all-dev
        apt install -y python3-setuptools git ca-certificates

    - name: Test Debian package build
      run: |
        export TRUENAS_PYOS_LIBURING_SRC="$GITHUB_WORKSPACE/liburing"
        dpkg-buildpackage -us -uc -b
